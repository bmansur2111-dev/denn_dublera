<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудио программы</title>
<style>
  :root {
    --bg: #eef3f1;
    --ink: #16283a;
    --muted: #5d7079;
    --line: #c9d6d9;
    --accent: #1f6f8b;
    --gold: #e0a92b;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1c28; --ink: #e6eef2; --muted: #93a7b1; --line: #26394a; --accent: #5bb3d0; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.4; }

  nav {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px;
  }
  nav a {
    flex: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); text-decoration: none; font-size: 15px; white-space: nowrap;
  }
  nav a:hover { border-color: var(--accent); }
  nav a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  main { max-width: 820px; margin: 0 auto; padding: 8px 20px 80px; }
  h1 { font-size: 15px; font-weight: 500; color: var(--muted); margin: 24px 0 0; }
  section { margin-top: 40px; }
  h2 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; }

  .track {
    position: relative; display: flex; align-items: center; gap: 16px;
    padding: 12px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: transparent; transition: background .15s, color .15s;
  }
  .track .name { font-size: 18px; overflow-wrap: anywhere; }
  .track .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--gold); }
  .track.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .track.bad .name::after { content: " — не удалось воспроизвести"; color: #c0392b; }

  button.play {
    flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; display: grid; place-items: center;
  }
  .track.on button.play { background: var(--gold); color: #16283a; }
  button.play svg { width: 22px; height: 22px; fill: currentColor; }
  .ico-pause { display: none; }
  .track.on.playing .ico-play { display: none; }
  .track.on.playing .ico-pause { display: block; }

  .empty { color: var(--muted); padding: 12px 0; font-size: 15px; }
  .empty code { background: var(--line); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<nav id="nav" aria-label="Разделы"></nav>
<main>
  <h1>Аудио программы</h1>
  <div id="app"></div>
</main>

<script>
const audio = new Audio();
audio.preload = 'none';
let cur = null; // строка, которая сейчас выбрана

const PLAY = '<svg class="ico-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE = '<svg class="ico-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function reset(row) {
  if (!row) return;
  row.classList.remove('on', 'playing');
  row.querySelector('.bar').style.width = '0';
  row.querySelector('button').setAttribute('aria-label', 'Включить');
}

function toggle(row, src) {
  if (cur === row) {
    audio.paused ? audio.play() : audio.pause();
    return;
  }
  reset(cur);
  cur = row;
  row.classList.remove('bad');
  row.classList.add('on');
  audio.src = src;
  audio.play().catch(() => row.classList.add('bad'));
}

audio.addEventListener('play', () => {
  if (!cur) return;
  cur.classList.add('playing');
  cur.querySelector('button').setAttribute('aria-label', 'Пауза');
});
audio.addEventListener('pause', () => {
  if (!cur) return;
  cur.classList.remove('playing');
  cur.querySelector('button').setAttribute('aria-label', 'Продолжить');
});
audio.addEventListener('timeupdate', () => {
  if (cur && audio.duration) cur.querySelector('.bar').style.width = (audio.currentTime / audio.duration) * 100 + '%';
});
audio.addEventListener('ended', () => { reset(cur); cur = null; });
audio.addEventListener('error', () => { if (cur) { cur.classList.add('bad'); cur.classList.remove('playing'); } });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

fetch('/api/tracks').then(r => r.json()).then(sections => {
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');

  sections.forEach((s, i) => {
    const id = 's' + i;

    const link = el('a', '', s.title);
    link.href = '#' + id;
    nav.appendChild(link);

    const sec = el('section');
    sec.id = id;
    sec.appendChild(el('h2', '', s.title));

    if (!s.files.length) {
      const p = el('p', 'empty');
      p.innerHTML = 'Пока пусто. Положите аудио в папку <code>audio/' + s.dir + '</code> и обновите страницу.';
      sec.appendChild(p);
    }

    s.files.forEach(f => {
      const row = el('div', 'track');
      const btn = el('button', 'play');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Включить');
      btn.innerHTML = PLAY + PAUSE;
      btn.addEventListener('click', () => toggle(row, f.src));
      row.append(btn, el('span', 'name', f.name), el('div', 'bar'));
      sec.appendChild(row);
    });

    app.appendChild(sec);
  });
});
</script>
</body>
</html>
